name: Deploy MEDICAL RP to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node for source checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate sources and rules
        run: |
          npm run check
          npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static artifact
        run: |
          mkdir -p /tmp/medical-rp-pages
          cp index.html .nojekyll /tmp/medical-rp-pages/
          cp -R css js games assets /tmp/medical-rp-pages/
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/medical-rp-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
